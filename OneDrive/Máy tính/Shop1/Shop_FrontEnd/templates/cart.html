<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giỏ hàng - E-Shop</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='cart.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="logo">
                <h1>🏥 E-Shop Pharmacy</h1>
            </div>
            <nav class="nav">
                <a href="{{ url_for('index_page') }}"><i class="fas fa-home"></i> Trang chủ</a>
                <a href="{{ url_for('list_products_page') }}"><i class="fas fa-list"></i> Sản phẩm</a>
                <a href="{{ url_for('cart_page') }}" class="active"><i class="fas fa-shopping-cart"></i> Giỏ hàng</a>
                <a href="{{ url_for('login_register_page') }}"><i class="fas fa-sign-in-alt"></i> Đăng nhập</a>
            </nav>
        </div>
    </header>

    <!-- Main -->
    <main class="main-content">
        <div class="container">
            <h1>🛒 Giỏ hàng của bạn</h1>

            <div class="cart-container">
                <!-- Cart Items -->
                <div class="cart-items">
                    <table class="cart-table">
                        <thead>
                            <tr>
                                <th>Sản phẩm</th>
                                <th>Giá</th>
                                <th>Số lượng</th>
                                <th>Tổng</th>
                                <th>Hành động</th>
                            </tr>
                        </thead>
                        <tbody id="cart-items-body">
                            <tr><td colspan="5" style="text-align:center;">Đang tải...</td></tr>
                        </tbody>
                    </table>
                </div>

                <!-- Cart Summary -->
                <div class="cart-summary">
                    <div class="summary-card">
                        <h3>Tóm tắt đơn hàng</h3>
                        <div class="summary-row">
                            <span>Tổng sản phẩm:</span>
                            <span id="total-items">0</span>
                        </div>
                        <div class="summary-row">
                            <span>Tổng tiền:</span>
                            <span id="total-price" class="price">0 VNĐ</span>
                        </div>
                        <hr>
                        <div class="summary-row">
                            <span>Mã giảm giá:</span>
                            <input type="text" id="promo-code" placeholder="Nhập mã" class="promo-input">
                        </div>
                        <button onclick="applyPromo()" class="btn btn-secondary" style="width:100%; margin-bottom:15px;">
                            Áp dụng
                        </button>
                        <button onclick="checkout()" class="btn btn-primary" style="width:100%; padding:15px; font-size:1.1em;">
                            <i class="fas fa-credit-card"></i> Thanh toán ngay
                        </button>
                        <button onclick="continueShopping()" class="btn btn-secondary" style="width:100%; margin-top:10px;">
                            Tiếp tục mua sắm
                        </button>
                    </div>
                </div>
            </div>

            <!-- Empty Cart Message -->
            <div id="empty-cart-message" style="display:none; text-align:center; padding:50px;">
                <i class="fas fa-shopping-cart" style="font-size:4em; color:#ccc; margin-bottom:20px;"></i>
                <p style="font-size:1.2em; color:#666;">Giỏ hàng của bạn trống</p>
                <a href="{{ url_for('list_products_page') }}" class="btn btn-primary" style="margin-top:20px;">
                    Quay lại mua sắm
                </a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2025 E-Shop Pharmacy. All rights reserved.</p>
    </footer>

    <script src="{{ url_for('static', filename='cart.js') }}"></script>
</body>
</html>
