<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Chủ - E-Shop</title>
    <link rel="stylesheet" href="../static/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="header-top">
            <a href="{{ url_for('index_page') }}" class="logo">
                <img src="images/logo_e_shop.png" alt="E-Shop Logo">
            </a>
            <div class="search-bar">
                <input type="text" placeholder="Tìm kiếm sản phẩm..." class="search-input">
                <button><i class="fas fa-search" id="search-btn"></i></button>
            </div>
            <div class="header-actions">
                <a href="cart.html" class="action-item">
                    <i class="fas fa-shopping-cart"></i>
                    <span>Giỏ hàng</span>
                </a>
                
                <div id="auth-status" class="action-item">
                    <a href="login_register.html" id="login-link" class="action-item">
                        <i class="fas fa-user"></i>
                        <span>Đăng nhập</span>
                    </a>
                </div>
            </div>
        </div>
        <div id="category-filter-panel" class="category-filter-panel">
        </div>
    </header>

    <main>
        <section class="hero-banner">
            <img src="images/banner_promo.png" alt="Banner khuyến mãi" style="width:100%; max-height: 350px; object-fit: cover;">
        </section>

        <section class="products-section">
            <div class="container">
                <h2>Sản phẩm hiện có</h2>
                <div class="product-grid" id="product-grid">
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2023 E-Shop. All rights reserved.</p>
            <div class="footer-links">
                <a href="#">Về chúng tôi</a> |
                <a href="#">Chính sách bảo mật</a> |
                <a href="#">Liên hệ</a> |
                
                <a href="./list_products.html" style="color: #667eea;">
                    <i class="fas fa-list-alt"></i> Quản lý Sản phẩm
                </a> |

                <a href="./admin_login.html" style="color: #667eea; font-weight: bold;">
                    <i class="fas fa-user-shield"></i> Admin Dashboard
                </a>
            </div>
        </div>
    </footer>

    <script src="../static/script.js"></script>
</body>
</html>
