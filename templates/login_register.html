<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập / Đăng ký - E-Shop</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="header-top">
            <a href="{{ url_for('index_page') }}" class="logo">
                <img src="images/logo_e_shop.png" alt="E-Shop Logo">
            </a>
            <div class="search-bar">
                <input type="text" placeholder="Tìm kiếm sản phẩm...">
                <button><i class="fas fa-search"></i></button>
            </div>
            <div class="header-actions">
                <a href="cart.html" class="action-item">
                    <i class="fas fa-shopping-cart"></i>
                    <span>Giỏ hàng</span>
                </a>
                <a href="login_register.html" class="action-item">
                    <i class="fas fa-user"></i>
                    <span>Đăng nhập</span>
                </a>
            </div>
        </div>
    </header>

    <main class="login-page-main">
        <div class="login-card">
            <div class="auth-tabs">
                <button class="tab-button active" data-tab="login">Đăng nhập</button>
                <button class="tab-button" data-tab="register">Đăng ký</button>
            </div>

            <form id="login-form" class="auth-form active">
                <h3>Đăng nhập tài khoản</h3>
                <div class="form-group">
                    <label for="login-username">Tên đăng nhập / Email</label>
                    <input type="text" id="login-username" placeholder="Nhập tên đăng nhập hoặc email" required>
                </div>
                <div class="form-group">
                    <label for="login-password">Mật khẩu</label>
                    <input type="password" id="login-password" placeholder="Nhập mật khẩu" required>
                </div>
                <div class="form-actions">
                    <label class="checkbox-container">
                        <input type="checkbox"> Ghi nhớ tôi
                        <span class="checkmark"></span>
                    </label>
                    <a href="#" class="forgot-password">Quên mật khẩu?</a>
                </div>
                <button type="submit" class="btn btn-primary">Đăng nhập</button>
            </form>

            <form id="register-form" class="auth-form">
                <h3>Đăng ký tài khoản mới</h3>
                <div class="form-group">
                    <label for="register-fname">Tên</label>
                    <input type="text" id="register-fname" placeholder="Tên của bạn" required>
                </div>
                <div class="form-group">
                    <label for="register-lname">Họ</label>
                    <input type="text" id="register-lname" placeholder="Họ của bạn" required>
                </div>
                <div class="form-group">
                    <label for="register-email">Email</label>
                    <input type="email" id="register-email" placeholder="Email của bạn" required>
                </div>
                <div class="form-group">
                    <label for="register-username">Tên đăng nhập</label>
                    <input type="text" id="register-username" placeholder="Tên đăng nhập mong muốn" required>
                </div>
                <div class="form-group">
                    <label for="register-password">Mật khẩu</label>
                    <input type="password" id="register-password" placeholder="Tạo mật khẩu" required>
                </div>
                <div class="form-group">
                    <label for="register-confirm-password">Xác nhận mật khẩu</label>
                    <input type="password" id="register-confirm-password" placeholder="Xác nhận mật khẩu" required>
                </div>
                <div class="form-group">
                    <label for="register-dob">Ngày sinh</label>
                    <input type="date" id="register-dob">
                </div>
                <div class="form-group">
                    <label for="register-address">Địa chỉ</label>
                    <input type="text" id="register-address" placeholder="Địa chỉ của bạn">
                </div>
                <button type="submit" class="btn btn-primary">Đăng ký tài khoản</button>
            </form>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2023 E-Shop. All rights reserved.</p>
            <div class="footer-links">
                <a href="#">Về chúng tôi</a> |
                <a href="#">Chính sách bảo mật</a> |
                <a href="#">Liên hệ</a> |
                
                <a href="./list_products.html" style="color: #667eea;">
                    <i class="fas fa-list-alt"></i> Quản lý Sản phẩm
                </a> |

                <a href="./admin_login.html" style="color: #667eea; font-weight: bold;">
                    <i class="fas fa-user-shield"></i> Admin Login
                </a>
            </div>
        </div>
    </footer>

    <script src="../js/script.js"></script>
</body>
</html>
